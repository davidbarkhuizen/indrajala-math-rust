# The Python extension (PyPI: indrajala-math-rust), bindings over the core (core/, crates.io:
# indrajala-math). One version for both, here (the release workplan's D4).
[package]
name = "indrajala_math_rust"
description = "Python bindings of indrajala-math: a numpy-like Array and fused neural network layer ops"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "indrajala_math_rust"
crate-type = ["cdylib"]

[workspace]
members = ["core"]

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2021"
repository = "https://github.com/davidbarkhuizen/indrajala-math-rust"
rust-version = "1.98"

[dependencies]
indrajala-math = { path = "core", version = "0.1.0" }
# multiple-pymethods: lets each source file (array.rs, ops.rs, linalg.rs, ...) add its own
# `#[pymethods] impl RustArray` block instead of accreting every method into one growing
# block in array.rs.
pyo3 = { version = "0.29", features = ["extension-module", "multiple-pymethods"] }

[lints.clippy]
# The kernels index several fixed-size accumulators and tiles in lockstep with one loop
# variable (acc[r][j], b_tile[j]), mirroring the math; iterator chains would obscure it.
needless_range_loop = "allow"

[profile.release]
# One codegen unit: what LLVM inlines no longer depends on how rustc splits the crate. With the
# default 16, a change in one file moved others' inlining: crate #65 left `matmul_long_k`'s kernel a
# call (conv `accumulate_gradient` +4-11% on `litshe`), and a wrapper added to fix it took a `Zip`
# out of `max_pool_downstream_batch` (+54% at 6x6 b32) (indrajala-ml's crate kernels workplan,
# stage 2). Only how the code is compiled changes, never an operation, so no bit moves.
codegen-units = 1
