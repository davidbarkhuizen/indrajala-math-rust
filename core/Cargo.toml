[package]
name = "indrajala-math"
description = "A 1D/2D f64 array and neural network kernels with the same bits on every machine, and numpy's generators bit for bit"
version.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/indrajala-math"
keywords = ["neural-network", "matrix", "deterministic", "simd", "numpy"]
categories = ["science", "mathematics"]

[lints.clippy]
# The kernels index several fixed-size accumulators and tiles in lockstep with one loop
# variable (acc[r][j], b_tile[j]), mirroring the math; iterator chains would obscure it.
needless_range_loop = "allow"
