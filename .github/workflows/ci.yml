name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No separate `cargo check`: the maturin build below compiles everything anyway (its
      # check-mode output isn't reused by that release build) and fails on the same errors. No
      # rust-cache either: the dependency builds it saves take ~6 s here, and its restore measured
      # 1-10 s, within the noise of the crate's own 3-24 s compile.
      # maturin pinned to match indrajala-ml's ./cli (maturin_version); numpy and pytest left
      # unpinned, so this CI checks the crate against the latest numpy while indrajala-ml's CI
      # checks it against that repo's pinned one.
      - name: Create venv and install Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin==1.15.0 pytest numpy
      - name: Build extension
        run: |
          source .venv/bin/activate
          maturin develop --release
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/
