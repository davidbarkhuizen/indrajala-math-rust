name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # glibc on both architectures (the aarch64 workplan in indrajala-ml, stage 4): the crate's bits
  # are claimed the same on every machine (its D1), and aarch64 runs the scalar fallbacks that no
  # x86_64 job reaches, clippy included (their `cfg(target_arch)` paths).
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # Installs rust-toolchain.toml's pinned toolchain (with rustfmt and clippy) before
      # rust-cache, so the cache is keyed on it rather than the runner image's stable.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --check
      # target/'s dependency builds (pyo3, syn, proc-macro2, ...; ~15 s uncached), keyed by
      # rust-cache on the toolchain, Cargo.lock and Cargo.toml; the crate itself always
      # recompiles. No separate `cargo check`: the maturin build below compiles everything anyway
      # and fails on the same errors - check only pre-built the shared proc-macro/build-script
      # dependencies, which rust-cache now restores instead.
      - uses: Swatinem/rust-cache@v2
      # Lint levels are in Cargo.toml's [lints]; -D warnings fails the job on any warning.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # maturin, ruff and pyright pinned to match indrajala-ml's ./cli (maturin_version,
      # ruff_version, pyright_version), mypy for its stubtest; numpy and pytest left unpinned, so
      # this CI checks the crate against the latest numpy while indrajala-ml's CI checks it
      # against that repo's pinned one.
      - name: Create venv and install Python deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin==1.15.0 ruff==0.16.9 pyright==1.1.414 mypy==2.3.1 pytest numpy
      - name: Ruff
        run: |
          source .venv/bin/activate
          ruff check .
          ruff format --check .
      - name: Build extension
        run: |
          source .venv/bin/activate
          maturin develop --release
      # The built module against indrajala_math_rust.pyi: names, parameter names and kinds. Run
      # outside the checkout, so it imports the installed package, not the repo's stub file.
      - name: Stubtest
        run: |
          source .venv/bin/activate
          cd "$RUNNER_TEMP" && python -m mypy.stubtest indrajala_math_rust --allowlist "$GITHUB_WORKSPACE/stubtest_allowlist.txt"
      # The stub's types against the tests' real usage (pyproject's [tool.pyright]).
      - name: Pyright
        run: |
          source .venv/bin/activate
          pyright
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/

  # musl (Alpine) on both architectures: the build and the tests, with musl's own C library and
  # allocator. Run by `docker run` after the host's checkout, not as a job `container:`: GitHub's
  # JavaScript actions (checkout, setup-python) don't run inside Alpine containers on arm runners.
  # Lints and the stub checks stay on the glibc jobs (the same source).
  musl:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    name: musl (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Build and test in Alpine
        run: |
          docker run --rm -v "$PWD:/crate" -w /crate python:3.14-alpine sh -euxc '
            apk add --no-cache build-base curl
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
            rustup toolchain install
            python -m venv /venv
            . /venv/bin/activate
            pip install maturin==1.15.0 pytest numpy
            maturin develop --release
            python -c "import platform; print(platform.machine(), platform.libc_ver())"
            pytest tests/
          '
