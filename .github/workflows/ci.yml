name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The full build-and-test matrix on every push and PR (indrajala-ml's release workplan, stage 4):
# every platform we ship, its wheels built and tested on its own runner, the sdist, and the core's
# own tests, lints and miri. release.yml runs the same before it publishes.
jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml
