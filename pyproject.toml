[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "indrajala-math-rust"
# the version is Cargo's (the workspace's), read by maturin: one version for both packages
dynamic = ["version"]
description = "A numpy-like Array and fused neural network layer ops in Rust, the same bits on every machine"
readme = "README-pypi.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Barkhuizen" }]
requires-python = ">=3.14"
keywords = ["neural-network", "numpy", "rust", "deterministic", "simd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/davidbarkhuizen/indrajala-math-rust"
Repository = "https://github.com/davidbarkhuizen/indrajala-math-rust"
Issues = "https://github.com/davidbarkhuizen/indrajala-math-rust/issues"
"Rust crate" = "https://crates.io/crates/indrajala-math"

[tool.maturin]
module-name = "indrajala_math_rust"
# the sdist builds the workspace with its pinned toolchain; the repo's own tooling stays out
exclude = [{ path = "CLAUDE.md", format = "sdist" }, { path = ".github/**/*", format = "sdist" }]

# Lint and type-check tools, pinned in CI (.github/workflows/ci.yml) to indrajala-ml's versions.
[tool.ruff]
line-length = 120

[tool.pyright]
include = ["tests", "indrajala_math_rust.pyi"]
typeCheckingMode = "standard"
